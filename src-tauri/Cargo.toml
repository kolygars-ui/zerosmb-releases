[package]
name = "zerosmb"
version = "1.1.0"
description = "ZeroTier + SMB NAS client with gallery, media previews and folder sync"
authors = ["kolygars-ui"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "zerosmb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "fs", "rt", "macros"] }
smb = "0.12"
smb-rpc = "0.12"
futures-util = "0.3"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
http = "1"
percent-encoding = "2"
mime_guess = "2"
time = "0.3"
log = "0.4"
zeroize = "1"
ureq = { version = "3", features = ["json"] }
onetun = { version = "0.3.10", default-features = false }
base64 = "0.22"
axum = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
unrar-rs = { version = "0.16", default-features = false, features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"
open = "5"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

